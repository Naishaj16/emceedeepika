<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Silver Metal Grille Gradient -->
    <linearGradient id="silverHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" />
      <stop offset="35%" style="stop-color:#E2E8F0" />
      <stop offset="70%" style="stop-color:#94A3B8" />
      <stop offset="100%" style="stop-color:#475569" />
    </linearGradient>

    <!-- Gold Luxury Handle Gradient -->
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A" />
      <stop offset="40%" style="stop-color:#D4AF37" />
      <stop offset="80%" style="stop-color:#92400E" />
      <stop offset="100%" style="stop-color:#451A03" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Red Hotspot Pointing Dot at Top Left Corner (0,0) -->
    <circle cx="2" cy="2" r="2" fill="#EF4444" stroke="#FFFFFF" stroke-width="0.5"/>

    <!-- Handle Base Nut -->
    <path d="M 23 25 L 26 28 C 27 29 28 28 27 27 L 24 24 Z" fill="#92400E" stroke="#1E293B" stroke-width="0.8"/>

    <!-- Main Tapered Gold Handle Body -->
    <path d="M 12 14 L 23 25 C 24.5 26.5 25.5 25.5 24 24 L 13 13 Z" fill="url(#goldBody)" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 11.5 13.5 L 22.5 24.5 L 24.5 22.5 L 13.5 11.5 Z" fill="url(#goldBody)" stroke="#0F172A" stroke-width="1.2"/>

    <!-- Gold Metallic Collar Ring -->
    <rect x="9.5" y="10.5" width="5" height="3" transform="rotate(-45 12 12)" fill="#FDE68A" stroke="#0F172A" stroke-width="1"/>

    <!-- Sphere Mic Grille Head (Top Left Angled) -->
    <circle cx="8" cy="8" r="6" fill="url(#silverHead)" stroke="#0F172A" stroke-width="1.2"/>

    <!-- Classic Shure SM58 / Stage Mic Cross Mesh Lines -->
    <path d="M 3.5 6 C 5.5 4 10.5 4 12.5 6" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 1"/>
    <path d="M 3.5 10 C 5.5 12 10.5 12 12.5 10" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 1"/>
    <line x1="8" y1="2" x2="8" y2="14" stroke="#1E293B" stroke-width="0.9"/>
    <line x1="2" y1="8" x2="14" y2="8" stroke="#1E293B" stroke-width="0.9"/>
    
    <!-- Outer Mic Collar Band -->
    <rect x="5.5" y="7.5" width="5" height="1.5" transform="rotate(-45 8 8)" fill="#0F172A"/>
  </g>
</svg>
