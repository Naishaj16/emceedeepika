    /* --- Extra tracking for the React (single-page) site --- */
    (function () {
      var lastPath = location.pathname;

      function onRouteChange() {
        if (location.pathname === lastPath) return;
        lastPath = location.pathname;
        fbq('track', 'PageView');
        if (/^\/contact/i.test(location.pathname)) fbq('track', 'Lead', { content_name: 'Contact page' });
      }

      // Lead on first load if landing directly on /contact
      if (/^\/contact/i.test(location.pathname)) fbq('track', 'Lead', { content_name: 'Contact page' });

      // Catch page changes made by React Router
      ['pushState', 'replaceState'].forEach(function (m) {
        var orig = history[m];
        history[m] = function () {
          var r = orig.apply(this, arguments);
          setTimeout(onRouteChange, 0);
          return r;
        };
      });
      window.addEventListener('popstate', onRouteChange);

      // WhatsApp and phone clicks
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (/wa\.me|whatsapp/i.test(href)) fbq('track', 'Contact', { content_name: 'WhatsApp click' });
        else if (/^tel:/i.test(href)) fbq('track', 'Contact', { content_name: 'Phone click' });
      }, true);
    })();
